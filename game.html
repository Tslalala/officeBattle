<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职场神话 · 三版本</title>
<style>
/* ============ 工位档案风 · 设计系统 ============ */
@font-face{font-family:"PixelCJK";src:local("Fusion Pixel"),local("FusionPixel-12px"),local("FusionPixel 12px"),local("Zpix"),local("Zpix 12px");font-display:swap}
:root{
 /* 夜 · 日光灯下的办公室 */
 --bg:#10181f;--bg2:#152029;--bg3:#1b2937;
 --line:#2b3d4d;--edge:#405a6f;--edge-hi:#5d7d95;
 --text:#e8e2d0;--muted:#8fa0ad;
 --gold:#f0c46c;--red:#e06060;--green:#8fd0a8;--blue:#8ab6d6;--purple:#b9a0d6;--teal:#5fc9b4;--ink:#070d13;
 /* 工位档案元素 */
 --paper:#ece0c0;--paper2:#dfcfa6;--paper-edge:#b3a171;--paper-ink:#38311f;--paper-mut:#7c7052;
 --stamp:#d4493c;--inkblue:#6b9bc9;--lamp:#ffd98c;
 /* 主题相关表面（浅主题整体翻转） */
 --surface:#152029;--surface2:#1b2937;--surface3:#22333f;
 --keytop:linear-gradient(180deg,#2c4155,#1c2c3b);
 --keysh:#060b11;--keyhi:rgba(255,255,255,.10);
 --chrome:linear-gradient(180deg,#1c2c3a,#121d27);
 --paperline:rgba(56,49,31,.09);
}
html.light{
 --bg:#e9dfc4;--bg2:#efe6cf;--bg3:#f6efdc;
 --line:#b5a67f;--edge:#9a8a64;--edge-hi:#8a6a2f;
 --text:#3b3325;--muted:#7d7157;
 --gold:#8a6a2f;--red:#a5402f;--green:#4e7a52;--blue:#4e6b85;--purple:#6a5a8a;--teal:#3e7a6a;--ink:#3b3325;
 --paper:#f6efdc;--paper2:#ece1c4;--paper-edge:#b5a67f;--paper-ink:#33302a;--paper-mut:#7d7157;
 --stamp:#a5402f;--inkblue:#3e6a9a;--lamp:#8a6a2f;
 --surface:#e9dfc4;--surface2:#f6efdc;--surface3:#fbf5e4;
 --keytop:linear-gradient(180deg,#fbf5e4,#e9dfc4);
 --keysh:rgba(0,0,0,.14);--keyhi:rgba(255,255,255,.55);
 --chrome:linear-gradient(180deg,#f3ead3,#e6dab8);
 --paperline:rgba(56,49,31,.10);
}
*{box-sizing:border-box}
body{margin:0;background:#0a1016;color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
html.light body{background:#d9cdae}
button{font:inherit;cursor:pointer}
/* 字体身份：公文/档案/标题/数字 */
:root{
 --font-doc:"FangSong","STFangsong","FangSong_GB2312","SimSun","宋体",serif;
 --font-head:"SimHei","黑体","Microsoft YaHei",sans-serif;
 --font-num:"Press Start 2P","PixelCJK",Consolas,"Courier New",monospace;
}
kbd{font-family:var(--font-num);background:var(--surface3);border:1px solid var(--edge);box-shadow:0 2px 0 var(--keysh);padding:1px 6px;font-size:10px;color:var(--muted)}
#game{width:100vw;height:100dvh;min-height:540px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
/* 顶栏 = 窗口标题栏 */
.top{height:46px;background:var(--chrome);border-bottom:2px solid #00000088;box-shadow:0 2px 0 #00000044;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:13px;letter-spacing:.06em;color:var(--muted);flex:none;position:relative}
.win-dots{display:inline-flex;gap:5px;margin-right:2px}
.win-dots i{width:9px;height:9px;display:block;border:1px solid #00000066}
.win-dots i:nth-child(1){background:#d4574a}
.win-dots i:nth-child(2){background:#e8b64c}
.win-dots i:nth-child(3){background:#69b578}
.top b{color:var(--gold);font-family:var(--font-head);letter-spacing:.18em}
.top .sp{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:0;background:#5a6a7d;margin-right:5px;vertical-align:middle}
.dot.on{background:#5fce8f;box-shadow:0 0 5px #5fce8f88}
.dot.off{background:#e06060}
.ic{width:15px;height:15px;flex:none;vertical-align:-2px}
.horror-only{display:none}
.mode-horror .horror-only{display:inline-flex;align-items:center;gap:5px}
.mode-horror .t-money,.mode-horror #modeName{display:none}
.mode-horror #llmTxt{display:none}
.t-loc{color:var(--teal);font-weight:700;letter-spacing:.1em}
.t-goal{color:var(--gold);font-size:12px}
.t-san{display:inline-flex;align-items:center;gap:6px}
.t-san .track{display:inline-block;width:52px;height:8px;border:1px solid var(--edge);background:var(--ink)}
.t-san .fill{display:block;height:100%;background:var(--purple);transition:width .3s}
.t-san b{color:var(--purple);min-width:22px;text-align:right;font-family:var(--font-num);font-size:11px}
/* 键帽按钮 */
.pxbtn,.qbtn,.choice,.act,.cbtn,.mini,.map-cell,.loc{
 background:var(--keytop);border:1px solid var(--keysh);border-top-color:var(--edge-hi);color:var(--text);border-radius:0;
 box-shadow:0 2px 0 var(--keysh),inset 0 1px 0 var(--keyhi);
}
.pxbtn{padding:5px 10px;font-size:12px}
.pxbtn:hover,.qbtn:hover,.choice:hover,.act:hover,.cbtn:hover,.map-cell:hover{border-top-color:var(--gold);color:var(--lamp)}
html.light .pxbtn:hover,html.light .qbtn:hover,html.light .choice:hover,html.light .act:hover,html.light .cbtn:hover,html.light .map-cell:hover{color:var(--stamp)}
.pxbtn:active,.qbtn:active,.choice:active,.act:active,.cbtn:active,.mini:active,.map-cell:active{transform:translateY(2px);box-shadow:0 0 0 var(--keysh),inset 0 1px 0 var(--keyhi)}
.qbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;font-size:12.5px}
.qbtn.warn{border-top-color:#8a4a42;color:#e0a0a0}
.qbtn.warn:hover{border-top-color:var(--red);color:var(--red)}
.qbtn .ic{width:13px;height:13px}
.primary{background:linear-gradient(180deg,#ffd98c,#e9b851);border:1px solid #8a6a2f;border-top-color:#ffe9bd;color:#241d10;padding:10px 20px;font-weight:700;border-radius:0;margin-top:10px;box-shadow:0 3px 0 #8a6a2f99,inset 0 1px 0 #ffffff88;font-family:var(--font-head);letter-spacing:.25em}
.primary:hover{background:linear-gradient(180deg,#ffe4a8,#f0c060);color:#241d10}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6a2f99}
/* 布局 */
.main{flex:1;display:flex;min-height:0}
.left{flex:1;display:flex;flex-direction:column;min-width:0}
.scene{flex:1;position:relative;overflow:hidden;background:#0d1522 url('assets/pixel/office-day.png') center/cover no-repeat;border-bottom:2px solid var(--edge);min-height:200px;image-rendering:pixelated}
html.light .scene{background-color:#d8cba8;filter:sepia(.22) saturate(.85)}
.scene.night{filter:brightness(.6) saturate(.85)}
/* ============ 浮沉记打磨：动画 ============ */
.scene-bg{position:absolute;inset:0;background:center/cover no-repeat;image-rendering:pixelated;z-index:0;animation:kb 46s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06) translate(-1.2%,-1%)}}
.scene-fade{position:absolute;inset:0;background:center/cover no-repeat;image-rendering:pixelated;z-index:1;opacity:0;pointer-events:none;transition:opacity .9s ease}
.scene-fade.on{opacity:1;transition:none}
.daycard{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,16,22,.92);z-index:60;pointer-events:none;opacity:0}
.daycard.in{animation:dayin 1.15s ease forwards}
.daycard b{font-family:var(--font-head);font-size:56px;letter-spacing:.4em;color:var(--gold);text-indent:.4em}
.daycard span{margin-top:14px;color:var(--muted);font-size:14px;letter-spacing:.3em}
@keyframes dayin{0%{opacity:0}14%{opacity:1}72%{opacity:1}100%{opacity:0}}
.text.typing:after{content:"▌";color:var(--gold);margin-left:2px;font-size:.85em;animation:flick 1s steps(2) infinite}
.eyebrow.stampin{display:inline-block;animation:stampin .5s cubic-bezier(.2,2.4,.4,1) .45s both}
@keyframes stampin{0%{transform:scale(2.8) rotate(-16deg);opacity:0}55%{transform:scale(.9) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
.card-in{animation:cardin .32s ease}
@keyframes cardin{from{transform:translateY(16px) scale(.98);opacity:0}}
.npc{animation:pkbob 3.4s ease-in-out infinite}
.npc:nth-child(odd){animation-delay:.9s}
.dot.on{animation:dotpulse 2.2s ease-in-out infinite}
@keyframes dotpulse{50%{box-shadow:0 0 10px #5fce8fcc}}
.pxbtn.off{opacity:.38}
html.light .scene.night{filter:sepia(.22) saturate(.8) brightness(.78)}
#game.dusk .scene{filter:brightness(.42) saturate(.75)}
html.light #game.dusk .scene{filter:sepia(.2) saturate(.72) brightness(.6)}
#game.dusk #dayInfo{color:var(--gold);font-weight:700}
.locbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:6;max-width:75%}
.loc{font-size:12px;padding:4px 10px}
.loc.cur{border-top-color:var(--gold);color:var(--lamp)}
html.light .loc.cur{color:var(--stamp)}
#mapBtn{position:absolute;top:10px;left:10px;z-index:7;display:none;padding:5px 10px;font-size:12px}
.mode-horror #mapBtn{display:inline-flex}
.mode-horror .locbar{display:none}
.loc-banner{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:7;background:var(--surface3);border:1px solid var(--teal);color:var(--teal);padding:6px 18px;font-size:15px;letter-spacing:.3em;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;font-family:var(--font-head)}
.loc-banner.show{opacity:1}
.mark{position:absolute;width:15px;height:15px;z-index:5;background:var(--teal);transform:rotate(45deg);border:2px solid #0a1119;opacity:.45;box-shadow:0 0 8px #5fc9b488;animation:markpulse 1.8s ease-in-out infinite}
.mark:hover,.mark:focus{opacity:1;animation:none}
@keyframes markpulse{50%{opacity:.85}}
/* 便利贴 toast */
.toasts{position:absolute;right:12px;top:12px;z-index:8;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.toast{background:linear-gradient(180deg,#f5e9a8,#eeda8c);color:#4a3d1e;border:1px solid #d9c36a;padding:6px 13px 8px;border-radius:0;font-size:13px;animation:tup .22s;transform:rotate(-1.2deg);box-shadow:2px 3px 6px #00000055;position:relative;font-family:var(--font-doc)}
.toast:before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(1.5deg);width:36px;height:10px;background:#ffffff59;border:1px solid #0000001a}
@keyframes tup{from{opacity:0;transform:translateX(16px) rotate(2deg)}}
.fx-noise{position:absolute;inset:0;z-index:9;pointer-events:none;display:none;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 2px,#5fc9b41c 2px 3px,transparent 3px 5px),repeating-linear-gradient(90deg,transparent 0 3px,#00000042 3px 4px)}
#game.fx-high .fx-noise{display:block;animation:noise .6s steps(2) infinite}
@keyframes noise{50%{transform:translateY(2px);opacity:.22}}
/* 场景人物 */
.npc{position:absolute;bottom:0;z-index:4;width:clamp(64px,11vw,120px);aspect-ratio:1/2;border:0;padding:0;background-color:transparent;background-size:400% 100%;background-repeat:no-repeat;image-rendering:pixelated;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 5px 4px #0006)}
.npc:hover{transform:translateY(-5px)}
.npc:active{transform:translateY(-2px)}
.npc::after{content:attr(data-name);position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-edge);font-size:11px;padding:2px 8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.npc:hover::after{opacity:1}
/* 状态条 = 打孔卡 */
.stat{height:34px;background:var(--bg2);border-top:1px solid var(--line);color:var(--gold);font-size:12px;display:flex;align-items:center;gap:14px;padding:0 14px;flex:none;overflow-x:auto;white-space:nowrap}
.mode-horror .stat{display:none}
.bars{flex:1;display:flex;gap:10px;align-items:center}
.meter{display:flex;align-items:center;gap:5px;color:var(--muted)}
.meter .track{width:64px;height:8px;background:var(--ink);border:1px solid var(--edge)}
.meter .fill{height:100%;transition:width .3s}
.mood{background:#5fce8f}.energy{background:#f2c879}.kpi{background:#8ab6d6}.favor{background:#f2b56b}.danger{background:#e06060}.san,.sanity{background:#b9a0d6}.weird{background:#c96a9a}.qi{background:#ff9d5c}
html.light .mood{background:#4e7a52}
html.light .energy{background:#a8842f}
html.light .kpi{background:#4e6b85}
html.light .favor{background:#a86f35}
html.light .danger{background:#a54a3f}
html.light .san,html.light .sanity{background:#6a5a8a}
html.light .weird{background:#8a4a68}
html.light .qi{background:#b26a2e}
/* 对白区 = 桌面记事 */
.dialog{flex:none;height:240px;background:var(--surface);border-top:2px solid var(--edge);padding:10px 14px 8px;display:flex;flex-direction:column;gap:7px}
.mode-horror .dialog{background:linear-gradient(#0e1828,#0b1320);border-top-color:#3c5a54;height:252px}
.d-main{display:flex;gap:12px;flex:1;min-height:0}
.avatar{width:84px;height:auto;flex:none;border:1px solid var(--paper-edge);background:var(--paper);padding:3px;position:relative;image-rendering:pixelated;overflow:hidden;box-shadow:2px 2px 0 #00000044}
.mode-horror .avatar{border-color:#3c5a54}
.avatar .av{position:absolute;inset:3px;image-rendering:pixelated;background-repeat:no-repeat;background-color:#0a1119}
.avatar .av.expr{background-size:300% 200%}
.avatar .av.chibi{background-size:400% 100%}
.avatar .av.expr{top:50%;left:3px;right:3px;bottom:auto;height:auto;aspect-ratio:1/1;transform:translateY(-50%)}
.avatar .av.chibi{top:50%;left:3px;right:3px;bottom:auto;height:auto;aspect-ratio:1/2;transform:translateY(-50%)}
.av-tile{position:absolute;inset:3px;display:grid;place-items:center;font-size:26px;color:#4d5f74;font-weight:700}
.d-body{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.d-head{display:flex;align-items:baseline;gap:10px;flex:none}
.speaker{font-size:14px;color:var(--paper-ink);font-weight:700;letter-spacing:.12em;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid var(--paper-edge);padding:1px 12px 2px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%);font-family:var(--font-head)}
.mode-horror .speaker{color:var(--teal);background:var(--surface3);border-color:#3c5a54}
.hint{margin-left:auto;color:#6d7f93;font-size:11px;text-align:right}
.textwrap{flex:1;overflow-y:auto;font-size:15px;line-height:1.62;white-space:pre-line;padding-right:6px;min-height:0}
.textwrap .text{color:#e5e0d2}
html.light .textwrap .text{color:#33302a}
.opts{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;flex:none}
.choice{padding:7px 13px;font-size:13px}
.choice.mini{font-size:12px;padding:4px 9px;box-shadow:0 1px 0 var(--keysh)}
.esc-strip{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;border:1px solid #3c5a54;background:#0c1622;padding:5px 8px;margin-top:6px}
.esc-strip .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #3c5a54;color:var(--teal);font-size:11.5px;padding:2px 7px;background:#0a121d}
.esc-strip .chip .th{width:20px;height:20px;display:inline-block;background-repeat:no-repeat;image-rendering:pixelated}
.esc-strip .st{margin-left:auto;color:var(--muted);font-size:11.5px}
/* 惊悚版快捷/输入 */
.quickbar{display:none;gap:7px;flex:none;flex-wrap:wrap}
.mode-horror .quickbar{display:flex}
.chatrow{display:none;gap:8px;flex:none;align-items:center}
.mode-horror .chatrow{display:flex}
.chatrow.on{display:flex}
.chat-ctx{flex:none;font-size:11.5px;color:var(--teal);border:1px solid #2c4a45;background:#0c1622;padding:6px 9px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow input{flex:1;background:var(--surface);border:1px solid var(--edge);border-top-color:var(--edge-hi);color:var(--text);border-radius:0;padding:8px 10px;font-size:13px;outline:none;min-width:0;box-shadow:inset 0 2px 0 #00000033}
.chatrow input:focus{border-top-color:var(--teal)}
.chatrow .choice{padding:8px 14px}
/* 右栏 = 抽屉柜 */
.right{width:252px;flex:none;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:inset 6px 0 14px -10px #000}
.mode-horror .right{display:none}
/* 工牌 */
.panel{padding:0 10px 4px;font-size:12px}
#selfPanel{position:relative;margin:10px 0 6px;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid var(--paper-edge);color:var(--paper-ink);padding:15px 11px 9px;clip-path:polygon(13px 0,100% 0,100% 100%,0 100%,0 13px);box-shadow:2px 3px 0 #00000044}
#selfPanel:before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:5px;background:#0a1016;border-radius:3px;box-shadow:inset 0 1px 2px #000}
.sp-dept{font-size:9.5px;letter-spacing:.28em;color:var(--paper-mut);text-align:center;margin-bottom:4px;font-family:var(--font-head)}
.sp-main{font-size:12.5px;line-height:1.5}
.sp-main b{font-family:var(--font-num);font-size:13px;color:var(--stamp)}
.sp-log{font-size:10.5px;color:var(--paper-mut);line-height:1.5;margin-top:4px;border-top:1px dashed var(--paper-edge);padding-top:4px;font-family:var(--font-doc)}
/* 行动 = 文件夹 */
.actions{flex:1;overflow-y:auto;padding:4px 10px 12px;border-top:1px solid var(--line)}
.actions h4{margin:11px 0 5px;font-size:11px;color:var(--stamp);letter-spacing:.3em;font-weight:700;font-family:var(--font-head);display:flex;align-items:center;gap:7px}
.actions h4:before{content:"";width:8px;height:8px;background:var(--stamp);flex:none}
.grp{margin:0 0 7px}
.grp summary{list-style:none;cursor:pointer;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid var(--paper-edge);color:var(--paper-ink);padding:7px 12px 7px 10px;font-size:13px;display:flex;align-items:center;gap:7px;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,0 100%);font-family:var(--font-head);letter-spacing:.08em}
.grp summary:hover{background:linear-gradient(180deg,#f6ecd2,#e6d6ae)}
.grp[open] summary{background:linear-gradient(180deg,#f6ecd2,#e6d6ae);box-shadow:inset 0 -2px 0 var(--stamp)}
html.light .grp summary{color:var(--paper-ink)}
.grp .sub{display:flex;flex-direction:column;gap:4px;padding:7px 2px 2px}
.sub .choice{text-align:left;box-shadow:0 1px 0 var(--keysh)}
.act{width:100%;text-align:left;padding:8px 10px;font-size:13px;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.act:disabled{opacity:.45;cursor:not-allowed}
.act small{color:var(--muted);flex:1;text-align:right;font-size:11px}
.log{height:118px;flex:none;border-top:1px solid var(--line);overflow-y:auto;padding:8px 12px;font-size:11.5px;line-height:1.6;color:#8398ad;background:repeating-linear-gradient(0deg,transparent 0 17px,var(--paperline) 17px 18px);font-family:var(--font-doc)}
.log p{margin:0 0 3px}
.log b{color:var(--gold);font-weight:normal}
/* 弹窗 = 牛皮纸档案 */
.overlay{position:absolute;inset:0;z-index:30;background:#070b12e6;display:flex;align-items:center;justify-content:center;padding:24px}
html.light .overlay{background:#d9cdaecc}
.hidden{display:none!important}
.card{width:min(680px,100%);max-height:92%;overflow-y:auto;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);border:1px solid var(--paper-edge);clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%);padding:26px 30px;position:relative}
.card h1{font-size:30px;margin:12px 0 8px;line-height:1.25;display:flex;align-items:center;gap:10px;font-family:var(--font-head);letter-spacing:.12em;border-bottom:3px double var(--stamp);padding-bottom:12px}
.card .eyebrow{color:var(--stamp);font-size:12px;letter-spacing:.3em;font-family:var(--font-head)}
.card p{line-height:1.85;color:var(--paper-ink);font-size:14px;margin:8px 0;font-family:var(--font-doc)}
.card .small{font-size:12px;color:var(--paper-mut);font-family:var(--font-doc)}
.modes{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.mode{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--paper-edge);background:linear-gradient(180deg,var(--paper),var(--paper2));border-radius:0;padding:14px 16px;color:var(--paper-ink);box-shadow:3px 3px 0 #00000033;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.mode:hover{box-shadow:4px 5px 0 #00000044;transform:translate(-1px,-1px)}
.mode .em{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--edge);background:#0a1119;flex:none;color:var(--gold)}
.mode .em .ic{width:19px;height:19px}
.mode b{color:var(--paper-ink);font-size:15px;display:block;font-family:var(--font-head);letter-spacing:.1em}
.mode .mdesc{display:block;font-size:12px;color:var(--paper-mut);margin-top:3px;line-height:1.5;font-family:var(--font-doc)}
.mode.hcard{border-color:#5d4a7d;background:#0a0f18 url('assets/pixel/hallway-title.png') right center/cover no-repeat;image-rendering:pixelated;min-height:100px}
.mode.hcard:hover{border-color:var(--purple)}
.mode.hcard:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0f18f2 32%,#0a0f1899)}
.mode.hcard>*{position:relative}
.mode.hcard b{color:var(--purple);letter-spacing:.18em}
.mode.hcard .tag{display:block;color:#d8cdf0;font-size:13px;margin-top:4px;font-family:var(--font-doc)}
.mode.hcard .mdesc{color:#9a8fc0}
.title-stamp{position:absolute;top:18px;right:26px;font-family:var(--font-head);color:var(--stamp);border:2.5px solid var(--stamp);padding:2px 10px;font-size:13px;letter-spacing:.25em;transform:rotate(8deg);opacity:.75;border-radius:2px}
.help{margin-top:6px;border:1px solid var(--paper-edge);background:var(--paper2)}
.help summary{cursor:pointer;padding:7px 12px;font-size:12px;color:var(--paper-mut);list-style:none;font-family:var(--font-head);letter-spacing:.15em}
.help[open] summary{border-bottom:1px solid var(--paper-edge)}
.help .help-body{padding:8px 12px 12px;font-size:12px;color:var(--paper-mut);line-height:1.7;font-family:var(--font-doc)}
.help kbd{background:var(--paper);border-color:var(--paper-edge);color:var(--paper-ink)}
/* 抽屉 */
.drawer-veil{position:absolute;inset:0;z-index:38;background:#05080ecc}
html.light .drawer-veil{background:#d9cdaac4}
.drawer{position:absolute;top:0;right:0;bottom:0;z-index:40;width:min(430px,94vw);background:var(--bg2);border-left:2px solid var(--edge);display:flex;flex-direction:column;box-shadow:-8px 0 24px #000a}
.drawer header{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--line)}
.drawer header b{letter-spacing:.2em;color:var(--gold);font-size:14px;font-family:var(--font-head)}
.drawer header .pxbtn{margin-left:auto}
.drawer-body{flex:1;overflow-y:auto;padding:12px 14px 18px}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map-cell{text-align:left;color:var(--text);padding:10px 12px;font-size:13px}
.map-cell .sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.map-cell.cur{border-top-color:var(--gold);color:var(--lamp)}
.map-cell.cur .sub{color:var(--gold)}
.map-cell.dim{opacity:.55}
/* 惊悚版手册/证据（保留青色氛围） */
.hb-rule{border:1px solid #2c4a45;background:#0c1622;padding:9px 12px;margin-bottom:8px}
html.light .hb-rule{border-color:#7d8a6a;background:#e9dfc4}
.hb-rule .rt{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.hb-rule .no{color:var(--teal);font-size:12px;letter-spacing:.15em;font-weight:700;font-family:var(--font-head)}
.hb-rule .chip{font-size:11px;padding:1px 7px;border:1px solid var(--edge);color:var(--muted)}
.hb-rule .chip.ok{border-color:var(--teal);color:var(--teal)}
.hb-rule .chip.bad{border-color:var(--red);color:var(--red)}
.hb-rule .rtext{font-size:13px;line-height:1.65;color:#d9e2e6;font-family:var(--font-doc)}
html.light .hb-rule .rtext{color:#3b3325}
.hb-rule .rlink{margin-top:5px;font-size:11.5px;color:var(--muted)}
.hb-rule .rlink button{background:none;border:0;color:var(--teal);padding:0;font-size:11.5px;text-decoration:underline;cursor:pointer}
.hb-rule .memo{margin-top:5px;font-size:11.5px;color:#c98a8a;border-top:1px dashed #2c3b4f;padding-top:4px;font-family:var(--font-doc)}
html.light .hb-rule .memo{color:#a55a4f;border-top-color:#b5a67f}
.hb-foot{font-size:12px;color:var(--muted);border:1px solid #2c4a45;padding:8px 12px;margin-top:4px;font-family:var(--font-doc)}
.hb-foot b{color:#c96a9a}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ev-card{border:1px solid var(--edge);background:var(--surface);padding:10px;min-height:124px}
.ev-card.got{border-color:#3c5a54}
.ev-card .th{width:56px;height:56px;margin:0 auto 7px;border:2px solid var(--edge);background:#0a1119 center/contain no-repeat;image-rendering:pixelated;display:grid;place-items:center;color:#41566e}
.ev-card.got .th{border-color:#3c5a54}
.ev-card h5{margin:0 0 4px;font-size:13px;color:var(--teal);text-align:center;font-family:var(--font-head);letter-spacing:.15em}
.ev-card .ew{font-size:11px;color:var(--muted);text-align:center}
.ev-card .ef{font-size:11.5px;color:#cfd8d4;line-height:1.5;margin-top:5px;font-family:var(--font-doc)}
html.light .ev-card .ef{color:#4a4436}
.ev-card .th .ic{width:24px;height:24px}
.ev-link{grid-column:1/-1;border:1px dashed #3c5a54;color:var(--muted);font-size:11.5px;padding:7px 10px}
.ev-unknown .th{color:#2c3b4f;font-size:20px;font-weight:700}
/* 规则清单 */
.rulelist{margin:10px 0;padding-left:0;list-style:none}
.rulelist li{background:var(--paper2);border:1px solid var(--paper-edge);border-left:4px solid var(--purple);padding:9px 13px;margin-bottom:7px;font-size:13.5px;line-height:1.6;color:var(--paper-ink);font-family:var(--font-doc)}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.25}}
.flick{animation:flick .22s steps(1) 2}
/* ============ 战斗 v3 · 作战报告 ============ */
.fun-only{display:none}
.mode-fun .fun-only{display:inline-flex;align-items:center;gap:5px}
.b2{width:min(900px,100%);padding:18px 20px 20px}
.b2-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--paper-mut);flex-wrap:wrap;border-bottom:1px solid var(--paper-edge);padding-bottom:9px}
.b2-head .eyebrow{font-family:var(--font-head);letter-spacing:.3em;color:var(--stamp);font-size:11.5px}
.b2-loc{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-head);letter-spacing:.12em;color:var(--paper-ink)}
.b2-tag{font-size:10px;padding:1px 8px;border:2px solid;font-family:var(--font-head);letter-spacing:.15em;transform:rotate(-2deg);opacity:.92}
.b2-tag.wild{color:var(--green);border-color:var(--green)}
.b2-tag.boss{color:var(--red);border-color:var(--red)}
/* 竞技场 = 监控屏 */
.b2-arena{position:relative;height:296px;border:2px solid #0a0f14;box-shadow:inset 0 0 0 1px #3a4f63,inset 0 0 26px #000000cc;background-color:#070d16;background-position:center;background-size:cover;overflow:hidden}
.b2-arena::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,transparent 30%,#050a12d9 96%),repeating-linear-gradient(0deg,transparent 0 3px,#00000018 3px 4px);pointer-events:none}
.b2-side{position:absolute;z-index:2;text-align:center;max-width:46%}
.b2-foe{top:14px;right:16px}
.b2-me{bottom:12px;left:16px}
.b2-sprite{display:inline-block;animation:pkbob 1.9s ease-in-out infinite}
.b2-foe .b2-sprite{animation-delay:.45s}
.b2-sprite canvas{display:block;image-rendering:pixelated;filter:drop-shadow(0 6px 5px #00000077)}
@keyframes pkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* 名牌 = 吊牌 / 工牌 */
.b2-plate-wrap.foe:before{content:"";display:block;width:2px;height:16px;background:#cbb27a;margin:0 auto -3px}
.b2-plate{min-width:216px;border:1px solid var(--paper-edge);background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);padding:7px 11px 8px;margin-top:8px;font-size:12px;text-align:left;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:2px 2px 0 #00000055}
.b2-foe .b2-plate{margin:0 0 8px auto}
.b2-plate-r1{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.b2-plate-r1 b{font-family:var(--font-head);letter-spacing:.06em}
.b2-lv{color:var(--paper-mut);font-size:10.5px;font-family:var(--font-num)}
.b2-chip{font-size:9.5px;border:1px solid;padding:0 5px;margin-left:4px;white-space:nowrap}
/* KPI 血条（两段式） */
.b2-hp{height:10px;background:#d9c9a0;border:1px solid var(--paper-edge);margin-top:5px;overflow:hidden;position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(56,49,31,.22) calc(25% - 1px) 25%)}
.b2-hp i{position:absolute;left:0;top:0;bottom:0;display:block}
.b2-hp .hpg{background:#f7e6b8;transition:width 1s ease .5s}
.b2-hp .hpm{transition:width .3s ease}
.b2-hp .hpm{background:var(--green)}
.b2-hptxt{font-size:10.5px;color:var(--paper-mut);margin-top:3px;font-family:var(--font-num);letter-spacing:.05em}
.b2-sts{min-height:15px;margin-top:3px}
.b2-st{font-size:9.5px;border:1px solid;padding:0 4px;margin-right:3px;font-family:var(--font-head)}
.b2-st.po{color:#8a4fa0;border-color:#8a4fa0;background:#8a4fa022}
.b2-st.pa{color:#a8842f;border-color:#a8842f;background:#a8842f22}
.b2-st.up{color:#4e7a52;border-color:#4e7a52;background:#4e7a5222}
.b2-st.dn{color:var(--stamp);border-color:var(--stamp);background:#d4493c22}
/* 摸鱼指数 = 咖啡 */
.b2-hype{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;width:200px;font-size:10px;color:#e8e2d0;text-align:center;font-family:var(--font-head);letter-spacing:.2em;text-shadow:0 1px 2px #000}
.b2-hype .cup{display:inline-block;width:12px;height:10px;border:2px solid #e8e2d0;border-top:0;vertical-align:-2px;margin-right:5px;background:linear-gradient(180deg,#c98a4b,#8a5a33);box-shadow:-2px 0 0 -1px #0000,2px 2px 0 0 #e8e2d0}
.b2-hype .tr{height:7px;border:1px solid #3a4f63;background:#0a0f14;margin-top:3px;box-shadow:0 1px 3px #00000088}
.b2-hype .tr i{display:block;height:100%;background:linear-gradient(90deg,#8a5a33,#c98a4b,#f2c879);transition:width .5s}
.b2-hype.max{color:#ffd98c}
.b2-hype.max .cup{background:linear-gradient(180deg,#ffd98c,#f2a0b1);box-shadow:0 0 8px #ffd98c88}
.b2-fx{position:absolute;inset:0;z-index:5;pointer-events:none}
/* 战报 = 打印纸条 */
.b2-log{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-edge);border-left:4px solid var(--paper-edge);padding:10px 14px 10px 12px;font-size:13.5px;line-height:1.72;max-height:122px;overflow-y:auto;white-space:normal;margin-top:12px;font-family:var(--font-doc);position:relative;background-image:repeating-linear-gradient(0deg,transparent 0 24px,var(--paperline) 24px 25px);box-shadow:2px 2px 0 #00000033}
.b2-log:before{content:"";position:absolute;top:-7px;left:34px;width:64px;height:14px;background:#d9c98c66;border:1px solid #00000022;transform:rotate(-2deg);pointer-events:none}
.b2ln{min-height:1em}
.b2-cmd{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cbtn{display:flex;align-items:center;gap:9px;padding:12px 15px;color:var(--text);font-size:15px;cursor:pointer;text-align:left;font-family:var(--font-head);letter-spacing:.3em;justify-content:flex-start}
.cbtn b{font-size:15px;font-weight:700}
.cbtn .ic{color:var(--gold)}
.cbtn kbd{margin-left:auto;font-size:9px}
.cbtn.lock{cursor:default;opacity:.5;letter-spacing:.15em}
.cbtn.lock:hover{border-top-color:var(--edge-hi);color:var(--text)}
.b2-sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.b2-subtitle{font-size:12px;color:var(--paper-mut);margin-top:10px;font-family:var(--font-head);letter-spacing:.2em}
.b2-mv{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid var(--paper-edge);border-top-color:var(--paper-edge);color:var(--paper-ink);padding:8px 11px;box-shadow:0 2px 0 #00000033}
.b2-mv span{font-size:13px;font-family:var(--font-head);letter-spacing:.05em}
.b2-mv small{color:var(--paper-mut);font-size:11px;font-family:var(--font-doc)}
.b2-mv:hover{box-shadow:0 3px 0 #00000044;transform:translateY(-1px)}
.b2-sub .choice:not(.b2-mv){background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);border:1px solid var(--paper-edge)}
.b2-team{display:flex;gap:8px;margin-top:12px}
.b2-tslot{flex:1;border:1px solid var(--paper-edge);background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);padding:6px 9px;font-size:11px;min-width:0;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.b2-tslot b{font-family:var(--font-head);letter-spacing:.05em}
.b2-tslot.on{border:2px solid var(--stamp);box-shadow:0 2px 0 #00000044}
.b2-cont{grid-column:1/-1;letter-spacing:.4em}
/* 结算 = 红头证书 */
.b2-end{text-align:center;padding:16px 10px 10px;position:relative;margin-top:2px}
.b2-end:before{content:"";position:absolute;left:10%;right:10%;top:0;border-top:6px double var(--stamp)}
.b2-end-title{font-size:26px;font-weight:700;color:var(--stamp);margin:12px 0 8px;font-family:var(--font-head);letter-spacing:.3em}
.b2-end p{font-size:13.5px;line-height:1.8;color:var(--paper-ink);max-width:560px;margin:0 auto 14px;font-family:var(--font-doc)}
.b2-end:after{content:"职";position:absolute;right:20px;top:16px;width:46px;height:46px;border:3px solid var(--stamp);color:var(--stamp);border-radius:50%;display:grid;place-items:center;font-family:var(--font-head);font-size:21px;transform:rotate(12deg);opacity:.8}
/* 飘字/动画 */
@keyframes fup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
.float-dmg{position:absolute;font-weight:700;font-size:19px;color:#ff6b5e;animation:fup .95s forwards;text-shadow:0 1px 3px #000;white-space:nowrap;font-family:var(--font-num);font-size:17px}
.float-heal{color:#5fce8f}
.float-crit{color:#ffd98c;font-size:22px}
.float-poison{color:#b06ad0}
@keyframes popin{0%{transform:translate(-50%,0) scale(.4);opacity:0}55%{transform:translate(-50%,-6px) scale(1.15);opacity:1}100%{transform:translate(-50%,-10px) scale(1)}}
.pop{position:absolute;z-index:6;font-size:13px;font-weight:700;padding:3px 10px;border:1px solid;background:var(--paper);color:inherit;animation:popin .9s forwards;white-space:nowrap;font-family:var(--font-head)}
@keyframes atkl{0%,100%{transform:translate(0)}40%{transform:translate(30px,-16px) scale(1.06)}}
@keyframes atkr{0%,100%{transform:translate(0)}40%{transform:translate(-30px,16px) scale(1.06)}}
@keyframes hitsh{0%,100%{transform:translateX(0);filter:none}25%{transform:translateX(-8px);filter:brightness(2.4)}55%{transform:translateX(7px)}80%{transform:translateX(-5px);filter:brightness(1.7)}}
.a-atk{animation:atkl .4s}
.a-atk-r{animation:atkr .4s}
.a-hit{animation:hitsh .42s}
@keyframes faint{to{transform:translateY(30px);opacity:0}}
.a-faint{animation:faint .55s forwards}
@keyframes ashake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,3px)}45%{transform:translate(4px,-3px)}70%{transform:translate(-3px,2px)}}
.arena-shake{animation:ashake .42s}
.b2-phase canvas{filter:saturate(1.8) hue-rotate(-16deg) drop-shadow(0 0 12px #ff554499)}
@keyframes ballfly{0%{left:16%;bottom:22%;transform:scale(.5) rotate(0)}70%{left:60%;bottom:56%;transform:scale(1) rotate(300deg)}100%{left:64%;bottom:58%;transform:scale(.9) rotate(360deg)}}
.b2-ball{position:absolute;z-index:6;width:26px;height:26px;border-radius:50%;border:2px solid #14181f;animation:ballfly .7s forwards;box-shadow:0 0 10px #ffd98c55}
@keyframes ballsh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-8deg)}75%{transform:translateX(6px) rotate(8deg)}}
.b2-ball.shake{animation:ballsh .4s}
/* 收服星星 */
@keyframes starpop{0%{transform:scale(.2) rotate(0deg);opacity:0}35%{opacity:1}100%{transform:scale(1.7) rotate(120deg);opacity:0}}
.b2-star{position:absolute;z-index:8;color:#ffd98c;font-size:20px;line-height:1;animation:starpop .85s forwards;text-shadow:0 0 8px #ffd98c;pointer-events:none}
/* 撒纸屑 */
@keyframes confettifall{0%{transform:translateY(-12px) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(320px) rotate(560deg);opacity:0}}
.confetti{position:absolute;top:-10px;width:7px;height:11px;z-index:9;animation:confettifall 2.6s linear forwards;pointer-events:none}
/* ============ 图鉴 = 员工档案 ============ */
.dex{width:min(760px,100%);padding:20px 22px}
.dex-tabs{display:flex;gap:7px;margin-bottom:14px;align-items:center}
.dex-tabs .pxbtn{font-family:var(--font-head);letter-spacing:.15em}
.pxbtn.on{border-top-color:var(--stamp);color:var(--stamp);box-shadow:0 2px 0 var(--keysh),inset 0 -2px 0 var(--stamp)}
.dex-team{display:grid;gap:9px}
.dex-tm{display:flex;gap:12px;border:1px solid var(--paper-edge);background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);padding:11px 12px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);box-shadow:2px 2px 0 #00000033}
.dex-tm-art{flex:none;background:#0a1119;border:1px solid var(--paper-edge);padding:4px}
.dex-tm-art canvas{display:block;image-rendering:pixelated}
.dex-tm-info{min-width:0;flex:1}
.dex-tm-info b{font-family:var(--font-head);letter-spacing:.08em}
.dex-dept{font-size:10.5px;color:var(--paper-mut);margin-top:1px;letter-spacing:.1em;font-family:var(--font-head)}
.dex-stats{font-size:11px;color:var(--paper-mut);margin-top:5px;font-family:var(--font-num);letter-spacing:.03em}
.dex-moves{font-size:11px;color:var(--paper-ink);opacity:.82;margin-top:3px;font-family:var(--font-doc)}
.dex-tmbtns{margin-top:8px;display:flex;gap:6px;align-items:center}
.dex-tmbtns .b2-lv{font-family:var(--font-head);letter-spacing:.15em}
.mini{font-size:11px;padding:2px 10px;cursor:pointer}
.mini.warn:hover{border-top-color:var(--stamp);color:var(--stamp)}
.dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.dex-cell{position:relative;border:1px solid var(--paper-edge);background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);padding:16px 7px 9px;text-align:center;font-size:11.5px;min-height:150px;box-shadow:2px 2px 0 #00000026}
.dex-cell:before{content:"";position:absolute;top:0;left:6px;width:30px;height:9px;background:var(--paper2);border:1px solid var(--paper-edge);border-top:0;clip-path:polygon(0 0,100% 0,86% 100%,0 100%)}
.dex-cell b{font-family:var(--font-head);letter-spacing:.1em}
.dex-cell-art{margin-bottom:6px}
.dex-cell-art canvas{display:block;margin:0 auto;image-rendering:pixelated}
.dex-cell.dim{filter:grayscale(1) brightness(.92);opacity:.75}
.dex-st{font-size:10px;margin-top:6px;display:inline-block;letter-spacing:.2em;border:2px solid;padding:1px 7px;transform:rotate(-4deg);font-family:var(--font-head);opacity:.92}
.dex-st.got{color:var(--stamp);border-color:var(--stamp);background:#d4493c14}
.dex-st.seen{color:var(--inkblue);border-color:var(--inkblue);background:#6b9bc914}
.dex-st.none{color:var(--paper-mut);border-color:var(--paper-mut);border-style:dashed;transform:rotate(0)}

const UPSTREAM="http://47.109.104.139:21000/v1";
const API_BASE=(location.protocol==="http:"||location.protocol==="https:")?location.origin+"/v1":UPSTREAM;
const MODEL="Qwen3.8-27B-BF16", API_KEY="callmemaybe";
let llmOK=null;
async function llm(messages,{json=false,maxTokens=700,temp=0.9,timeout=45000}={}){
  const body={model:MODEL,messages,temperature:temp,max_tokens:maxTokens,chat_template_kwargs:{enable_thinking:false}};
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(API_BASE+"/chat/completions",{method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();const c=d.choices[0].message.content;setLLM(true);return c;
  }finally{clearTimeout(t)}
}
function setLLM(ok){llmOK=ok;const d=$("llmDot");if(d)d.className="dot "+(ok?"on":"off");const t=$("llmTxt");if(t)t.textContent=ok?"已连接":"离线";

function parseJSON(txt){
  const t=String(txt??"").replace(/```/g,"");const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("no json");
  try{return JSON.parse(m[0])}catch(e){return JSON.parse(m[0].replace(/,\s*([}\]])/g,"$1"))}
}
async function pingLLM(){

}
function parseEvent(txt){

    for(const k in o){if(/^rel_/.test(k)&&S&&S.rel[k.slice(4)]!=null)fx[k]=n(o[k])}
    return {label:String(o.label||"继续").slice(0,20),result:String(o.result||"").slice(0,120),fx}});
  if(!opts.length)throw new Error("empty");
  return {title:String(j.title||"突发事件"),text:String(j.text||"").slice(0,400),options:opts};
}
