<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职场神话 · 三版本</title>
<style>
:root{--bg:#0d1420;--line:#2c3b4f;--edge:#41566e;--text:#e9e4d6;--muted:#8fa0b3;--gold:#f2c879;--red:#e06060;--green:#9fd4bb;--blue:#8ab6d6;--purple:#b9a0d6;--teal:#5fc9b4;--ink:#080d15}
*{box-sizing:border-box}body{margin:0;background:#070b12;color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}
#game{width:100vw;height:100dvh;min-height:540px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{height:44px;background:#0b1220;border-bottom:2px solid #35465c;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:13px;letter-spacing:.06em;color:var(--muted);flex:none}
.top b{color:var(--gold)}.top .sp{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:0;background:#5a6a7d;margin-right:5px;vertical-align:middle}.dot.on{background:#5fce8f;box-shadow:0 0 5px #5fce8f88}.dot.off{background:#e06060}
.ic{width:15px;height:15px;flex:none;vertical-align:-2px}
.horror-only{display:none}
.mode-horror .horror-only{display:inline-flex;align-items:center;gap:5px}
.mode-horror .t-money,.mode-horror #modeName{display:none}
.mode-horror #llmTxt{display:none}
.t-loc{color:var(--teal);font-weight:700;letter-spacing:.1em}
.t-goal{color:var(--gold);font-size:12px}
.t-san{display:inline-flex;align-items:center;gap:6px}
.t-san .track{display:inline-block;width:52px;height:8px;border:1px solid var(--edge);background:var(--ink)}
.t-san .fill{display:block;height:100%;background:var(--purple);transition:width .3s}
.t-san b{color:var(--purple);min-width:22px;text-align:right}
.pxbtn{background:#101b2b;border:1px solid var(--edge);color:var(--text);border-radius:0;padding:5px 10px;font-size:12px;box-shadow:2px 2px 0 #050910}
.pxbtn:hover{border-color:var(--gold);color:var(--gold)}
.main{flex:1;display:flex;min-height:0}
.left{flex:1;display:flex;flex-direction:column;min-width:0}
.scene{flex:1;position:relative;overflow:hidden;background:#0d1522 url('assets/pixel/office-day.png') center/cover no-repeat;border-bottom:2px solid #35465c;min-height:200px;image-rendering:pixelated}
.scene.night{filter:brightness(.6) saturate(.85)}
#game.dusk .scene{filter:brightness(.42) saturate(.75)}
#game.dusk #dayInfo{color:var(--gold);font-weight:700}
.locbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:6;max-width:75%}
.loc{background:#101b2bd9;border:1px solid var(--edge);color:#c6d5e4;font-size:12px;padding:4px 10px;border-radius:0}
.loc.cur{border-color:var(--gold);color:var(--gold)}
#mapBtn{position:absolute;top:10px;left:10px;z-index:7;display:none;background:#0c1422dd}
.mode-horror #mapBtn{display:inline-flex}
.mode-horror .locbar{display:none}
.loc-banner{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:7;background:#0c1422f0;border:1px solid var(--teal);color:var(--teal);padding:6px 18px;font-size:15px;letter-spacing:.3em;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.loc-banner.show{opacity:1}
.mark{position:absolute;width:15px;height:15px;z-index:5;background:var(--teal);transform:rotate(45deg);border:2px solid #0a1119;opacity:.45;box-shadow:0 0 8px #5fc9b488;animation:markpulse 1.8s ease-in-out infinite}
.mark:hover,.mark:focus{opacity:1;animation:none}
@keyframes markpulse{50%{opacity:.85}}
.toasts{position:absolute;right:12px;top:12px;z-index:8;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.toast{background:#0c1422ee;border:1px solid #4d637f;padding:5px 12px;border-radius:0;font-size:13px;animation:tup .2s}
@keyframes tup{from{opacity:0;transform:translateX(16px)}}
.fx-noise{position:absolute;inset:0;z-index:9;pointer-events:none;display:none;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 2px,#5fc9b41c 2px 3px,transparent 3px 5px),repeating-linear-gradient(90deg,transparent 0 3px,#00000042 3px 4px)}
#game.fx-high .fx-noise{display:block;animation:noise .6s steps(2) infinite}
@keyframes noise{50%{transform:translateY(2px);opacity:.22}}
/* 场景站立人物（chibi 全身立绘，底对齐） */
.npc{position:absolute;bottom:0;z-index:4;width:clamp(64px,11vw,120px);aspect-ratio:1/2;border:0;padding:0;background-color:transparent;background-size:400% 100%;background-repeat:no-repeat;image-rendering:pixelated;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 5px 4px #0006)}
.npc:hover{transform:translateY(-5px)}
.npc:active{transform:translateY(-2px)}
.npc::after{content:attr(data-name);position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);background:#0c1422ee;border:1px solid var(--edge);color:var(--text);font-size:11px;padding:2px 8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.npc:hover::after{opacity:1}
.stat{height:32px;background:#0e1725;border-top:1px solid var(--line);color:var(--gold);font-size:12px;display:flex;align-items:center;gap:14px;padding:0 14px;flex:none;overflow-x:auto;white-space:nowrap}
.mode-horror .stat{display:none}
.bars{flex:1;display:flex;gap:10px;align-items:center}
.meter{display:flex;align-items:center;gap:5px;color:var(--muted)}.meter .track{width:64px;height:8px;background:var(--ink);border:1px solid var(--edge)}.meter .fill{height:100%;transition:width .3s}
.mood{background:#5fce8f}.energy{background:#f2c879}.kpi{background:#8ab6d6}.favor{background:#f2b56b}.danger{background:#e06060}.san,.sanity{background:#b9a0d6}.weird{background:#c96a9a}.qi{background:#ff9d5c}
/* 对白区 */
.dialog{flex:none;height:240px;background:#101a2a;border-top:2px solid #41566e;padding:10px 14px 8px;display:flex;flex-direction:column;gap:7px}
.mode-horror .dialog{background:linear-gradient(#0e1828,#0b1320);border-top-color:#3c5a54;height:252px}
.d-main{display:flex;gap:12px;flex:1;min-height:0}
.avatar{width:82px;height:auto;flex:none;border:2px solid var(--edge);background:#0a1119;position:relative;image-rendering:pixelated;overflow:hidden}
.mode-horror .avatar{border-color:#3c5a54}
.avatar .av{position:absolute;inset:2px;image-rendering:pixelated;background-repeat:no-repeat}
.avatar .av.expr{background-size:300% 200%}
.avatar .av.chibi{background-size:400% 100%}
/* 头像比例修正：expr 为 3×2 方脸表、chibi 为 4 列 1:2 表，均按原始比例取格，避免拉伸/错位 */
.avatar .av.expr{top:50%;left:2px;right:2px;bottom:auto;height:auto;aspect-ratio:1/1;transform:translateY(-50%)}
.avatar .av.chibi{top:50%;left:2px;right:2px;bottom:auto;height:auto;aspect-ratio:1/2;transform:translateY(-50%)}
.av-tile{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#4d5f74;font-weight:700}
.d-body{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.d-head{display:flex;align-items:baseline;gap:10px;flex:none}
.speaker{font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.12em}
.mode-horror .speaker{color:var(--teal)}
.hint{margin-left:auto;color:#6d7f93;font-size:11px;text-align:right}
.textwrap{flex:1;overflow-y:auto;font-size:15px;line-height:1.62;white-space:pre-line;padding-right:6px;min-height:0}
.textwrap .text{color:#e5e0d2}
.opts{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;flex:none}
.choice{border:1px solid #6d7f93;background:#17263a;color:var(--text);border-radius:0;padding:7px 13px;font-size:13px;box-shadow:2px 2px 0 #060b12}
.choice:hover{transform:translateY(-1px);border-color:var(--gold)}
.choice.mini{font-size:12px;padding:4px 9px;box-shadow:none;background:#14202f}
.esc-strip{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;border:1px solid #3c5a54;background:#0c1622;padding:5px 8px;margin-top:6px}
.esc-strip .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #3c5a54;color:var(--teal);font-size:11.5px;padding:2px 7px;background:#0a121d}
.esc-strip .chip .th{width:20px;height:20px;display:inline-block;background-repeat:no-repeat;image-rendering:pixelated}
.esc-strip .st{margin-left:auto;color:var(--muted);font-size:11.5px}
/* 快捷入口与输入（惊悚版） */
.quickbar{display:none;gap:7px;flex:none;flex-wrap:wrap}
.mode-horror .quickbar{display:flex}
.qbtn{display:inline-flex;align-items:center;gap:6px;background:#101b2b;border:1px solid var(--edge);color:#c6d5e4;border-radius:0;padding:6px 11px;font-size:12.5px;box-shadow:2px 2px 0 #050910}
.qbtn:hover{border-color:var(--teal);color:var(--teal)}
.qbtn.warn{border-color:#6e3d3d;color:#e0a0a0}
.qbtn.warn:hover{border-color:var(--red);color:var(--red)}
.qbtn .ic{width:13px;height:13px}
.chatrow{display:none;gap:8px;flex:none;align-items:center}
.mode-horror .chatrow{display:flex}
.chatrow.on{display:flex}
.chat-ctx{flex:none;font-size:11.5px;color:var(--teal);border:1px solid #2c4a45;background:#0c1622;padding:6px 9px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow input{flex:1;background:#0b1320;border:1px solid var(--edge);color:var(--text);border-radius:0;padding:8px 10px;font-size:13px;outline:none;min-width:0}
.chatrow input:focus{border-color:var(--teal)}
.chatrow .choice{padding:8px 14px}
/* 右栏（认真/娱乐版） */
.right{width:252px;flex:none;background:#0e1725;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mode-horror .right{display:none}
.panel{padding:10px 12px 6px;font-size:12px}
.actions{flex:1;overflow-y:auto;padding:4px 10px 12px;border-top:1px solid var(--line)}
.actions h4{margin:9px 0 4px;font-size:11px;color:var(--muted);letter-spacing:.2em;font-weight:normal}
.grp{margin:0 0 6px}
.grp summary{list-style:none;cursor:pointer;background:#152335;border:1px solid var(--edge);border-radius:0;padding:7px 10px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px}
.grp summary:hover{border-color:var(--gold)}
.grp[open] summary{border-color:var(--gold);color:var(--gold)}
.grp .sub{display:flex;flex-direction:column;gap:4px;padding:6px 2px 2px}
.sub .choice{text-align:left;box-shadow:none;background:#14202f}
.act{width:100%;text-align:left;background:#152335;border:1px solid var(--edge);border-radius:0;padding:7px 10px;font-size:13px;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.act:hover{border-color:var(--gold)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act small{color:var(--muted);flex:1;text-align:right;font-size:11px}
.log{height:118px;flex:none;border-top:1px solid var(--line);overflow-y:auto;padding:8px 12px;font-size:11.5px;line-height:1.55;color:#8398ad}
.log p{margin:0 0 3px}.log b{color:var(--gold);font-weight:normal}
/* 弹窗 */
.overlay{position:absolute;inset:0;z-index:30;background:#070b12e6;display:flex;align-items:center;justify-content:center;padding:24px}
.hidden{display:none!important}
.card{width:min(680px,100%);max-height:92%;overflow-y:auto;border:2px solid #7a6845;background:#101a2af7;padding:24px 28px;box-shadow:6px 6px 0 #04070d}
.card h1{font-size:29px;margin:10px 0 8px;line-height:1.25;display:flex;align-items:center;gap:10px}
.card .eyebrow{color:var(--gold);font-size:12px;letter-spacing:.25em}
.card p{line-height:1.8;color:#cfd4d2;font-size:14px;margin:8px 0}
.card .small{font-size:12px;color:#8fa0b3}
.modes{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.mode{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--edge);background:#111c2c;border-radius:0;padding:13px 16px;color:var(--text);box-shadow:3px 3px 0 #060b12}
.mode:hover{border-color:var(--gold)}
.mode .em{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--edge);background:#0a1119;flex:none}
.mode .em .ic{width:19px;height:19px}
.mode b{color:var(--gold);font-size:15px;display:block}
.mode .mdesc{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.mode.hcard{border-color:#5d4a7d;background:#0a0f18 url('assets/pixel/hallway-title.png') right center/cover no-repeat;image-rendering:pixelated;min-height:100px}
.mode.hcard:hover{border-color:var(--purple)}
.mode.hcard:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0f18f2 32%,#0a0f1899)}
.mode.hcard>*{position:relative}
.mode.hcard b{color:var(--purple);letter-spacing:.18em}
.mode.hcard .tag{display:block;color:#d8cdf0;font-size:13px;margin-top:4px}
.help{margin-top:6px;border:1px solid var(--line);background:#0c1422}
.help summary{cursor:pointer;padding:7px 12px;font-size:12px;color:var(--muted);list-style:none}
.help[open] summary{border-bottom:1px solid var(--line)}
.help .help-body{padding:8px 12px 12px;font-size:12px;color:#8fa0b3;line-height:1.7}
kbd{background:#14202f;border:1px solid var(--edge);border-radius:0;padding:1px 6px;font-size:11px}
.primary{background:var(--gold);border:0;color:#1a2432;padding:10px 20px;font-weight:700;border-radius:0;margin-top:10px;box-shadow:3px 3px 0 #060b12}
.primary:hover{background:#ffe1a0}
/* 抽屉（地图/手册/证据） */
.drawer-veil{position:absolute;inset:0;z-index:38;background:#05080ecc}
.drawer{position:absolute;top:0;right:0;bottom:0;z-index:40;width:min(430px,94vw);background:#0d1725;border-left:2px solid #41566e;display:flex;flex-direction:column;box-shadow:-8px 0 24px #000a}
.drawer header{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--line)}
.drawer header b{letter-spacing:.2em;color:var(--gold);font-size:14px}
.drawer header .pxbtn{margin-left:auto}
.drawer-body{flex:1;overflow-y:auto;padding:12px 14px 18px}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map-cell{text-align:left;background:#101b2b;border:1px solid var(--edge);color:#c6d5e4;padding:10px 12px;font-size:13px;border-radius:0}
.map-cell:hover{border-color:var(--teal)}
.map-cell .sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.map-cell.cur{border-color:var(--gold);color:var(--gold)}
.map-cell.cur .sub{color:var(--gold)}
.map-cell.dim{opacity:.55}
.hb-rule{border:1px solid #2c4a45;background:#0c1622;padding:9px 12px;margin-bottom:8px}
.hb-rule .rt{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.hb-rule .no{color:var(--teal);font-size:12px;letter-spacing:.15em;font-weight:700}
.hb-rule .chip{font-size:11px;padding:1px 7px;border:1px solid var(--edge);color:var(--muted)}
.hb-rule .chip.ok{border-color:var(--teal);color:var(--teal)}
.hb-rule .chip.bad{border-color:var(--red);color:var(--red)}
.hb-rule .rtext{font-size:13px;line-height:1.65;color:#d9e2e6}
.hb-rule .rlink{margin-top:5px;font-size:11.5px;color:var(--muted)}
.hb-rule .rlink button{background:none;border:0;color:var(--teal);padding:0;font-size:11.5px;text-decoration:underline;cursor:pointer}
.hb-rule .memo{margin-top:5px;font-size:11.5px;color:#c98a8a;border-top:1px dashed #2c3b4f;padding-top:4px}
.hb-foot{font-size:12px;color:var(--muted);border:1px solid #2c4a45;padding:8px 12px;margin-top:4px}
.hb-foot b{color:#c96a9a}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ev-card{border:1px solid var(--edge);background:#101b2b;padding:10px;min-height:124px}
.ev-card.got{border-color:#3c5a54}
.ev-card .th{width:56px;height:56px;margin:0 auto 7px;border:2px solid var(--edge);background:#0a1119 center/contain no-repeat;image-rendering:pixelated;display:grid;place-items:center;color:#41566e}
.ev-card.got .th{border-color:#3c5a54}
.ev-card h5{margin:0 0 4px;font-size:13px;color:var(--teal);text-align:center}
.ev-card .ew{font-size:11px;color:var(--muted);text-align:center}
.ev-card .ef{font-size:11.5px;color:#cfd8d4;line-height:1.5;margin-top:5px}
.ev-card .th .ic{width:24px;height:24px}
.ev-link{grid-column:1/-1;border:1px dashed #3c5a54;color:var(--muted);font-size:11.5px;padding:7px 10px}
.ev-unknown .th{color:#2c3b4f;font-size:20px;font-weight:700}
/* 战斗 */
.battle{width:min(760px,100%)}
.bwrap{display:flex;gap:16px;margin:14px 0}
.fighter{flex:1;border:1px solid var(--edge);padding:12px;background:#0c1422}
.fighter h3{margin:0 0 6px;font-size:15px;color:var(--gold)}
.fighter .foe{text-align:right}
.hp{height:12px;background:var(--ink);border:1px solid var(--edge);margin-top:6px}
.hp .fill{height:100%;background:linear-gradient(90deg,#e06060,#f2c879);transition:width .35s}
.mvs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.blog{background:#0b1320;border:1px solid var(--line);padding:10px 14px;font-size:13px;line-height:1.65;max-height:130px;overflow-y:auto;white-space:pre-line}
.rulelist{margin:10px 0;padding-left:0;list-style:none}
.rulelist li{background:#141020;border:1px solid #5d4a7d;border-left:3px solid var(--purple);padding:9px 13px;margin-bottom:7px;font-size:13.5px;line-height:1.6;color:#d8cdf0}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.25}}
.flick{animation:flick .22s steps(1) 2}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* 移动端 */
@media(max-width:760px){
 #game{height:100dvh;min-height:540px;border:none}
 .top{flex-wrap:wrap;height:auto;min-height:40px;padding:4px 10px;gap:8px;font-size:11px}
 .t-goal{flex-basis:100%;order:9}
 .main{flex-direction:column}
 .scene{min-height:168px;flex:1 1 44%}
 .right{display:none!important}
 .dialog{height:auto;max-height:46%}
 .d-main{gap:9px}
 .avatar{width:58px}
 .npc{width:20vw}
 .textwrap{font-size:13.5px}
 .quickbar{overflow-x:auto;flex-wrap:nowrap}
 .qbtn{flex:none}
 .chat-ctx{display:none}
 .drawer{width:100vw}
}
/* ============ 浅色主题 · 羊皮纸（单色调） ============ */
html.light body{background:#d9cdae;color:#3b3325}
html.light #game{background:#efe6cf}
html.light .top{background:#e9dfc4;border-bottom-color:#b5a67f;color:#6a5f49}
html.light .top b{color:#8a6a2f}
html.light .t-loc{color:#3e7a6a}
html.light .t-goal{color:#8a6a2f}
html.light .t-san .track{background:#d9cca6}
html.light .t-san b,html.light .t-san .fill{color:#6a5a8a;background:#6a5a8a}
html.light .pxbtn{background:#f6efdc;border-color:#9a8a64;color:#3b3325;box-shadow:2px 2px 0 #00000022}
html.light .pxbtn:hover{border-color:#8a6a2f;color:#8a6a2f}
html.light .scene{background-color:#d8cba8;border-bottom-color:#b5a67f;filter:sepia(.22) saturate(.85)}
html.light .scene.night{filter:sepia(.22) saturate(.8) brightness(.78)}
html.light #game.dusk .scene{filter:sepia(.2) saturate(.72) brightness(.6)}
html.light .loc{background:#f4ecd9e6;border-color:#9a8a64;color:#54493a}
html.light .loc.cur{border-color:#8a6a2f;color:#8a6a2f}
html.light #mapBtn{background:#f4ecd9ee}
html.light .loc-banner{background:#f4ecd9f2;border-color:#3e7a6a;color:#3e7a6a}
html.light .mark{border-color:#efe6cf}
html.light .toast{background:#f4ecd9f2;border-color:#8a7a58}
html.light .fx-noise{background:repeating-linear-gradient(0deg,transparent 0 2px,#6a5a3a24 2px 3px,transparent 3px 5px),repeating-linear-gradient(90deg,transparent 0 3px,#0000002e 3px 4px)}
html.light .npc::after{background:#f4ecd9f2;border-color:#9a8a64;color:#3b3325}

const UPSTREAM="http://10.133.72.161:20133/v1";
const API_BASE=(location.protocol==="http:"||location.protocol==="https:")?location.origin+"/v1":UPSTREAM;
const MODEL="Qwen3.8-27B-BF16", API_KEY="callmemaybe";
let llmOK=null;
async function llm(messages,{json=false,maxTokens=700,temp=0.9,timeout=45000}={}){
  const body={model:MODEL,messages,temperature:temp,max_tokens:maxTokens,chat_template_kwargs:{enable_thinking:false}};
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(API_BASE+"/chat/completions",{method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();const c=d.choices[0].message.content;setLLM(true);return c;
  }finally{clearTimeout(t)}
}
function setLLM(ok){llmOK=ok;const d=$("llmDot");if(d)d.className="dot "+(ok?"on":"off");const t=$("llmTxt");if(t)t.textContent=ok?"已连接":"离线";
 const tl=$("titleLlm");if(tl)tl.textContent=ok?"已连接":"离线（内置剧本，剧情照常）";}
function parseJSON(txt){
  const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error("no json");
  return JSON.parse(m[0]);
}
async function pingLLM(){
  try{await llm([{role:"user",content:"回复：OK"}],{maxTokens:8,temp:0});}catch(e){setLLM(false);}
}
function parseEvent(txt){
  const j=parseJSON(txt);
  const opts=(j.options||[]).slice(0,4).map(o=>{
    const fx={mood:n(o.mood),energy:n(o.energy),kpi:n(o.kpi),favor:n(o.favor),danger:n(o.danger),money:n(o.money||0,2000),san:n(o.sanity||o.san||0),weird:n(o.weird||0),qi:n(o.qi||0)};
    for(const k in o){if(/^rel_/.test(k)&&S&&S.rel[k.slice(4)]!=null)fx[k]=n(o[k])}
    return {label:String(o.label||"继续").slice(0,20),result:String(o.result||"").slice(0,120),fx}});
  if(!opts.length)throw new Error("empty");
  return {title:String(j.title||"突发事件"),text:String(j.text||"").slice(0,400),options:opts};
}

   rules.forEach((r,i)=>{

async function politics(kind,tid){
 const P=POLITICS[kind],n=NPCS[tid];
 const lines=P.acts.map((a,i)=>[a[0],()=>doPolitics(kind,tid,i)]);
 say(P.title+" · 目标："+n.name+"（关系"+S.rel[tid]+"，情报×"+S.intel+"）","你想对"+n.name+"做什么？欺软怕硬是职场通行证，但也是双刃剑。",lines);
 async function doPolitics(kind,tid,i){
  const P=POLITICS[kind],a=P.acts[i],n=NPCS[tid];
  const power=S.st.kpi+S.intel*5+S.allies.length*8+S.st.favor/4;
  let base=40+(power-S.rel[tid]*0.3)/2;
  if(a[0]==="硬刚")base=20+S.st.kpi/4+(S.rel.zhou<40?20:0);
  if(a[0]==="拍马屁")base=85;
  if(a[0]==="汇报工作"||a[0]==="请奶茶")base=90;
  if(a[0]==="结盟")base=S.rel[tid]>45?75:35;
  const ok=Math.random()*100<clamp(base,5,95);
  const fx={...a[2]};
  if(ok){if(a[3])fx["rel_"+tid]=a[3];if(kind==="peer"&&a[0]==="结盟"){if(!S.allies.includes(tid))S.allies.push(tid);}}
  else{fx["rel_"+tid]=(a[4]||-8);if(a[0]==="甩锅"||a[0]==="抢功")fx.danger=(fx.danger||0)+10;fx.mood=(fx.mood||0)-5;}
  applyFx(fx);
  logIt(P.title+"→"+n.name+"："+a[0]+(ok?"（成功）":"（失败）"));
  LLM_BUSY=true;const my=++ppToken;
  say("旁白","（正在推演这场交锋…）",[["跳过",()=>{ppToken++;show()}]]);
  let line=null;try{line=(await llm([{role:"user",content:"职场游戏《职场神话》（"+modeName()+"）。主角对"+n.name+"（"+n.tag+"，人设："+n.style+"）发动了「"+a[0]+"」（意图："+a[1]+"），结果是"+(ok?"成功":"失败")+"。主角状态："+stateSummary()+"。请用60~100字生动描述这场交锋的过程与"+n.name+"的反应，符合模式风格。只输出描述本身。"}],{maxTokens:220,temp:0.9})).trim();if(my!==ppToken)return}catch(e){}
  function show(){say("【"+a[0]+" · "+(ok?"得手":"翻车")+"】",line||(ok?"你得手了，一切尽在掌握。":"翻车了。"+n.name+"的反应比你预想的激烈，办公室的目光都聚了过来。"),[["继续",()=>advanceTime()]])}
  show();}}

async function playerMove(i){
 PMOVES.forEach((_,k)=>{if($("mv"+k))$("mv"+k).disabled=true});
 const [mname,,base]=PMOVES[i];let line="";
 let dmg=0,heal=0,captured=false;

 if(i===3){if(S.snacks>0){S.snacks--;const chance=25+(1-B.hp/B.b.hp)*50;if(Math.random()*100<chance)captured=true;dmg=base}}
 if(i===4){heal=35}

 line+="你使出了【"+mname+"】！";
 if(captured){line+="\n"+B.b.name+"盯着零食，缓缓趴下……收服成功！！";}
 else if(dmg)line+="造成了 "+dmg+" 点伤害！";
 if(i===4)line+="\n（你蹲了一回合，对方趁机出手）";
 if(!captured&&B.hp>0&&i!==2){

  else{const bd=Math.round(rnd(mvp-4,mvp+6));B.php=Math.max(0,B.php-bd);line+="\n"+B.b.name+"使出【"+mvn+"】！你受到 "+bd+" 点伤害！"}
 }else if(i===2){const mv=pick(B.b.moves);const bd=Math.round(rnd(mv[1]-4,mv[1]+4));B.php=Math.max(0,B.php-bd);line+="\n你摸鱼的瞬间，"+B.b.name+"使出【"+mv[0]+"】！你受到 "+bd+" 点伤害！"}
 B.turn++;
 try{const t=(await llm([{role:"user",content:"职场宝可梦对战解说（热血搞笑风，30~60字）：玩家使用了【"+mname+"】（效果："+(captured?"收服成功":dmg?"造成"+dmg+"伤害":heal?"回复"+heal+"斗志":"-")+"），对手"+B.b.name+"HP剩"+B.hp+"，玩家HP剩"+B.php+"。"+(captured?"":"请补一句对手反击的画面。只输出解说。")+"请输出JSON：{\"t\":\"解说\"}"}],{maxTokens:120,temp:1.0,timeout:15000}));

 if(B.php<=0)return battleEnd("lose");}

   if(S.intel>=3&&S.allies.length>=2&&s.favor>=35){eyebrow="认真版 · 隐藏结局";title="斗倒周主管";body="考核会上，你与盟友们甩出三份证据链。周主管的微笑第一次僵住。三个月后，你坐进了那间办公室，抽屉里放着一包没吃完的零食——现在的你，也需要有人惧怕。职场神话，由此开始。";fx={salary:S.salary*2}}
   else if(s.kpi>=65&&s.favor>=60){eyebrow="认真版 · 最佳结局";title="升职加薪";body="'本次季度晋升：是你。'周主管伸出手，笑得标准。涨薪30%。你想起第十天清晨的地铁，一切都值了——吗？"}
   else if(s.kpi>=65&&s.favor<40){eyebrow="认真版 · 工具人结局";title="年度最佳工具人";body="绩效A，奖金一千。晋升名单上没有你。周主管拍拍你的肩：'年轻人，不要急。'你盯着他身后的工位，突然很想学他敲一敲别人的隔板。"}
   else if(s.favor>=60&&s.kpi<40){eyebrow="认真版 · 老实人结局";title="忠诚老实人奖";body="'你很稳定。'这是考核结论的全部。稳定地加班，稳定地微笑，稳定地拿着这份工资。茶水间的零食，成了你唯一的反抗。"}
   else if(s.mood<25){eyebrow="认真版 · 消耗殆尽";title="心先离职了";body="考核还没开始，你先在工位上发了一小时的呆。屏幕上是没写完的周报，标题是《我的十年规划》。你把它删了，打开招聘软件。"}
   else{eyebrow="认真版 · 平凡结局";title="续约的打工人";body="考核结果：B，合格，续约。你请小吴喝了奶茶，和林棠在天台散了散步。这都不是神话，但日子还长，机会也还长。"}}
  else{
   if(S.flags.bigBeaten){eyebrow="娱乐版 · 传说结局";title="新任传说社长";body="退休之影消散时，整栋楼响起了掌声——包括打印机、咖啡机和大门。你接过工牌：'社长'。第一位向你汇报的员工，是变成训练家助理的周主管。图鉴完成度：100%。"}
   else if(s.qi>=90&&s.mood>=80){eyebrow="娱乐版 · 悠闲结局";title="摸鱼真仙";body="你不打宝可梦，不抢功劳，只是每天准时消失在茶水间。传说你已参透'带薪真言'，连退休之影都绕着你走。仙人，请受徒儿一拜。"}
   else if(s.favor<25){eyebrow="娱乐版 · 特殊结局";title="被HR宝可梦捕获";body="KPI金蝎的毒针命中要害。你被装进'优化球'，被传送去了另一个部门。醒来时，训练家何姐微笑着：'欢迎来到新图鉴。'"}
   else{eyebrow="娱乐版 · 平凡结局";title="快乐的训练家";body="十天里你收服了零碎的宝可梦、零食和心情。日子不好不坏，但明天电视里的摩尔庄园会更新，人生也是。"}}
 }
 modal.innerHTML="<div class='eyebrow'>"+eyebrow+"</div><h1>"+title+"</h1><p>"+body+"</p><p class='small'>最终状态：绩效"+S.st.kpi+" · 好感"+S.st.favor+" · 心情"+S.st.mood+" · 存款¥"+S.money.toLocaleString()+(fx&&fx.salary?" · 新月薪¥"+fx.salary.toLocaleString():"")+"</p><button class='primary' id='re'>再来一局（换个版本？）</button>";
 if(fx&&fx.salary)S.salary=fx.salary;
 $("re").onclick=()=>{localStorage.removeItem("officeMyth");location.reload()};
 localStorage.removeItem("officeMyth");}
/* ============ 深浅色主题（羊皮纸浅色） ============ */
function currentTheme(){return document.documentElement.classList.contains("light")?"light":"dark"}
function setTheme(t){
 document.documentElement.classList.toggle("light",t==="light");
 try{localStorage.setItem("officeMythTheme",t)}catch(e){}
 const b=$("themeBtn");
 if(b){b.innerHTML=ic(t==="light"?"moon":"sun");b.title=t==="light"?"切换为深色主题":"切换为浅色（羊皮纸）主题";}}
function toggleTheme(){setTheme(currentTheme()==="light"?"dark":"light")}
/* ============ 存档 ============ */
function saveGame(manual){try{if(S)localStorage.setItem("officeMyth",JSON.stringify(S));if(manual)toast("已存档","#5fce8f")}catch(e){}}
function loadGame(){try{const d=localStorage.getItem("officeMyth");return d?JSON.parse(d):null}catch(e){return null}}
/* ============ 启动 ============ */
function titleScreen(){
 $("game").className="boot";
 const modal=$("modal");$("overlay").classList.remove("hidden");
 const save=loadGame();
 modal.className="card";modal.innerHTML="<div class='eyebrow'>办公室剧情游戏 · 大模型驱动</div><h1>职场神话</h1>"
  +"<p>玩手机、带薪拉屎、B站、摩尔庄园、顺零食……以及勾心斗角、欺软怕硬、对上斗智斗勇。选择你的版本，创造属于你的职场神话。</p>"
  +"<div class='modes'>"
  +'<button class="mode" data-m="serious"><span class="em">'+ic("trend")+'</span><span style="flex:1"><b>'+MODES.serious.name+"</b><span class='mdesc'>"+MODES.serious.desc+"</span></span></button>"
  +'<button class="mode" data-m="fun"><span class="em">'+ic("spark")+'</span><span style="flex:1"><b>'+MODES.fun.name+"</b><span class='mdesc'>"+MODES.fun.desc+"</span></span></button>"
  +'<button class="mode hcard" data-m="horror"><span class="em">'+ic("flame")+'</span><span style="flex:1"><b>请于下班前离开</b><span class="tag">下班铃响过之后，这栋楼并不打算放你走。</span><span class="mdesc">七条守则 · 五份证据 · 一条真正的出口。查明陈序，然后在第二次广播响起前离开。</span></span></button>'
  +"</div>"
  +(save?"<button class='choice' id='cont'>"+ic("folder")+"继续上次进度（"+esc(save.mode)+" 第"+save.day+"天）</button> ":"")
  +"<details class='help'><summary>连接与帮助</summary><div class='help-body'>后台大模型："+MODEL+"（<span id='titleLlm'>"+(llmOK===null?"检测中…":llmOK?"已连接":"离线（内置剧本，剧情照常进行）")+"</span>）。<br>若始终显示离线，请运行 <kbd>python serve.py</kbd> 后访问 <kbd>http://127.0.0.1:8787/game.html</kbd>。<br>进度自动保存在本机浏览器；即使完全离线，三个版本都可以完整通关。</div></details>";
 modal.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{startGame(b.dataset.m)});
 if(save)$("cont").onclick=()=>{S=save;if(isHorror())Horror.ensure();HorUI.chatTarget=null;$("overlay").classList.add("hidden");
  if(isHorror()&&S.slot>=SLOTS.length)return Horror.evening();
  render();say("旁白","欢迎回来。第"+S.day+"天，故事继续。",[["开始行动",()=>render()]])};}
function startGame(mode){
 S=newState(mode);
 if(mode==="horror")Horror.ensure();
 HorUI.chatTarget=null;HorUI.closeDrawer();
 $("overlay").classList.add("hidden");render();
 say("旁白","你在栖木公司综合事业部报到。工位靠窗，第四张桌子空着。今天是第1天，距离季度考核还有10天。"+(mode==="fun"?"听说这栋楼的领导都养宝可梦。":mode==="horror"?"前台公示栏贴着一张《办公室守则》，好像比昨天多了几条。":"主管姓周，笑得很标准。"),[["开始打工",()=>{if(mode==="horror"){newDayStart()}else{say("旁白","09:00，打卡机滴的一声。你的社畜人生开始了。",[["开始行动",()=>render()]])}}]]);
 saveGame();}
window.Game={act,politics,startBattle,openRules,toiletFree,saveGame:(m)=>saveGame(m===1),moveTo:(k)=>moveTo(k),toggleTheme:toggleTheme};
window.addEventListener("load",()=>{HorUI.init();setTheme(currentTheme());titleScreen();pingLLM()});
</script>
<script src="horror.js"></script>
</body>
</html>
